    <rect x="238" y="54" width="170" height="86" rx="8" fill="#ffffff" stroke="#2c7a7b"/>
    <text x="277" y="90" font-weight="700">REST API</text>
    <text x="270" y="116" font-size="13" fill="#596579">JSON and ISO XML</text>
    <rect x="238" y="174" width="170" height="86" rx="8" fill="#ffffff" stroke="#805ad5"/>
